<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Weather — a little forecast</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f2f6fb;
      --surface: rgba(255, 255, 255, .82);
      --surface-solid: #fff;
      --text: #172338;
      --muted: #718096;
      --line: rgba(35, 56, 83, .09);
      --blue: #3378d4;
      --blue-soft: #eaf3ff;
      --shadow: 0 24px 70px rgba(35, 69, 111, .11), 0 3px 12px rgba(35, 69, 111, .04);
      --sun: #f0ad4e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101722;
        --surface: rgba(28, 39, 55, .86);
        --surface-solid: #1c2737;
        --text: #edf3fb;
        --muted: #9caec4;
        --line: rgba(220, 235, 255, .1);
        --blue: #77b4ff;
        --blue-soft: #233a56;
        --shadow: 0 24px 70px rgba(0, 0, 0, .3), 0 3px 12px rgba(0, 0, 0, .12);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 18px 32px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -10%, rgba(104, 173, 246, .18), transparent 48%),
        var(--page);
      font-size: 15px;
      line-height: 1.5;
    }

    .app { width: min(100%, 464px); margin: 0 auto; }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 18px;
    }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(145deg, #67b7ff, #3974dc);
      box-shadow: 0 5px 12px rgba(51, 120, 212, .24);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

    .search { position: relative; display: flex; align-items: center; margin-bottom: 15px; }
    .search svg { position: absolute; left: 16px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .search input {
      width: 100%;
      height: 50px;
      padding: 0 102px 0 44px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 5px 20px rgba(35, 69, 111, .035);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    .search input::placeholder { color: var(--muted); opacity: .8; }
    .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 17%, transparent); }
    .search button {
      position: absolute;
      right: 6px;
      min-width: 76px;
      height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: #347bd6;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }
    .search button:hover { background: #286bc2; }
    .search button:active { transform: scale(.97); }
    .search button:disabled { cursor: wait; opacity: .7; }
    .search-message { min-height: 18px; margin: -8px 4px 10px; color: var(--muted); font-size: 12px; }
    .search-message.error { color: #d46a52; }

    .weather-panel {
      position: relative;
      overflow: hidden;
      padding: 24px 25px 21px;
      border: 1px solid rgba(255, 255, 255, .52);
      border-radius: 23px;
      background:
        radial-gradient(circle at 91% 8%, rgba(255, 255, 255, .48), transparent 29%),
        linear-gradient(135deg, #b9ddff 0%, #d8ebff 48%, #eaf3ff 100%);
      box-shadow: var(--shadow);
      color: #1c3e62;
    }
    @media (prefers-color-scheme: dark) {
      .weather-panel {
        border-color: rgba(220, 235, 255, .08);
        background:
          radial-gradient(circle at 90% 4%, rgba(127, 177, 239, .17), transparent 32%),
          linear-gradient(135deg, #203852, #24364a 57%, #253345);
        color: #eaf4ff;
      }
    }
    .weather-panel::after {
      position: absolute;
      top: -70px;
      right: -68px;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 24px rgba(255, 255, 255, .06), 0 0 0 48px rgba(255, 255, 255, .04);
      pointer-events: none;
    }
    .location-row { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-start; }
    .location { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 700; letter-spacing: -.025em; }
    .location svg { width: 17px; height: 17px; opacity: .72; }
    .date { margin-top: 2px; color: inherit; opacity: .72; font-size: 13px; }
    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 999px;
      color: inherit;
      background: rgba(255, 255, 255, .27);
      font-size: 11px;
      font-weight: 650;
    }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #48a977; box-shadow: 0 0 0 3px rgba(72, 169, 119, .15); }
    .conditions { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; min-height: 153px; padding: 11px 0 6px; }
    .temp { font-size: clamp(76px, 21vw, 100px); font-weight: 300; letter-spacing: -.09em; line-height: .98; }
    .temp sup { position: relative; top: -.24em; margin-left: 3px; font-size: .37em; font-weight: 400; letter-spacing: -.02em; }
    .condition-copy { margin: 8px 0 0 5px; font-size: 15px; font-weight: 620; }
    .feels { margin: 2px 0 0 5px; opacity: .7; font-size: 13px; }
    .hero-icon { width: 120px; height: 120px; margin-right: 6px; filter: drop-shadow(0 10px 13px rgba(57, 102, 143, .14)); }
    .details {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(47, 92, 137, .14);
    }
    .detail { display: flex; align-items: center; gap: 9px; padding-left: 10px; }
    .detail:first-child { padding-left: 1px; }
    .detail-icon { width: 18px; height: 18px; opacity: .72; }
    .detail-label { display: block; opacity: .65; font-size: 11px; }
    .detail-value { display: block; margin-top: 1px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 3px 12px; }
    .section-head h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .unit-toggle { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .unit-toggle button { min-width: 39px; padding: 4px 8px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font: inherit; font-size: 12px; font-weight: 650; cursor: pointer; }
    .unit-toggle button[aria-pressed="true"] { color: #fff; background: #347bd6; }
    .unit-toggle button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .day-card {
      display: flex;
      min-height: 148px;
      flex-direction: column;
      align-items: center;
      padding: 13px 5px 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(35, 69, 111, .035);
      text-align: center;
      transition: transform .18s, border-color .18s;
    }
    .day-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); }
    .day-name { font-size: 12px; font-weight: 650; }
    .day-icon { width: 37px; height: 37px; margin: 7px 0 6px; }
    .day-condition { min-height: 18px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .day-temps { display: flex; gap: 7px; margin-top: 7px; font-size: 12px; font-weight: 700; }
    .day-temps .low { color: var(--muted); font-weight: 500; }
    .footer { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 20px 0 0; color: var(--muted); font-size: 11px; }
    .footer svg { width: 14px; height: 14px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }

    @media (max-width: 390px) {
      body { padding: 30px 13px 24px; }
      .weather-panel { padding: 21px 18px 18px; }
      .hero-icon { width: 105px; height: 105px; margin-right: 0; }
      .forecast { gap: 6px; }
      .day-card { min-height: 141px; padding-inline: 3px; }
      .day-temps { gap: 5px; font-size: 11px; }
      .detail { gap: 6px; padding-left: 5px; }
      .detail-value { font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7.5 17.5h9.1a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 5.7 10a3.8 3.8 0 0 0 1.8 7.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m9 20 1-1.5m4.2 1.5 1-1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span>Weather</span>
      </div>
      <span class="eyebrow">To plan your day</span>
    </header>

    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="city-search">Search for a city</label>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.4 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="city-search" type="search" placeholder="Search a city..." autocomplete="off">
      <button id="search-button" type="submit">Search</button>
    </form>
    <p class="search-message" id="search-message" role="status" aria-live="polite"></p>

    <section class="weather-panel" aria-label="Current weather">
      <div class="location-row">
        <div>
          <div class="location">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="2.3" stroke="currentColor" stroke-width="1.7"/></svg>
            <span id="location">Fargo, ND</span>
          </div>
          <div class="date" id="today">Loading local time…</div>
        </div>
        <span class="live-tag"><span class="live-dot" id="status-dot"></span><span id="data-status">Live weather</span></span>
      </div>

      <div class="conditions">
        <div>
          <div class="temp"><span id="temperature">--</span><sup id="temperature-unit">°F</sup></div>
          <p class="condition-copy" id="condition">Getting conditions…</p>
          <p class="feels" id="feels-like">Feels like --°</p>
        </div>
        <div id="hero-icon" aria-hidden="true"></div>
      </div>

      <div class="details" aria-label="Weather details">
        <div class="detail">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v11.2a4 4 0 1 0 2 0V3a2 2 0 0 0-4 0v11.2a4 4 0 1 0 2 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <div><span class="detail-label">High / Low</span><span class="detail-value" id="high-low">--° / --°</span></div>
        </div>
        <div class="detail">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3s6 6.3 6 11a6 6 0 1 1-12 0c0-4.7 6-11 6-11Z" stroke="currentColor" stroke-width="1.7"/><path d="M9 15a3 3 0 0 0 3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <div><span class="detail-label">Humidity</span><span class="detail-value" id="humidity">--%</span></div>
        </div>
        <div class="detail">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 8h12a3 3 0 1 0-3-3M2 12h17a2.5 2.5 0 1 1-2.5 2.5M4 16h8a2 2 0 1 1-2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <div><span class="detail-label">Wind</span><span class="detail-value" id="wind">-- mph</span></div>
        </div>
      </div>
    </section>

    <div class="section-head">
      <h2>5-day forecast</h2>
      <div class="unit-toggle" role="group" aria-label="Temperature unit">
        <button id="unit-f" type="button" aria-pressed="true" aria-label="Show temperatures in Fahrenheit">°F</button>
        <button id="unit-c" type="button" aria-pressed="false" aria-label="Show temperatures in Celsius">°C</button>
      </div>
    </div>
    <section class="forecast" id="forecast" aria-label="Five-day forecast"></section>
    <footer class="footer">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7.5 17.5h9.1a4.4 4.4 0 0 0 .5-8.8A5.9 5.9 0 0 0 5.7 10a3.8 3.8 0 0 0 1.8 7.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Weather data by Open-Meteo
    </footer>
  </main>

  <script>
    const FALLBACK = {
      name: "Fargo",
      admin1: "North Dakota",
      country_code: "US",
      timezone: "America/Chicago",
      current: { temperature_2m: 12, apparent_temperature: 11, relative_humidity_2m: 58, wind_speed_10m: 9, weather_code: 2, is_day: 1 },
      daily: {
        time: ["2026-09-29", "2026-09-30", "2026-10-01", "2026-10-02", "2026-10-03", "2026-10-04"],
        weather_code: [2, 1, 3, 61, 2, 0],
        temperature_2m_max: [15, 17, 14, 11, 13, 16],
        temperature_2m_min: [6, 7, 4, 3, 4, 6],
        precipitation_probability_max: [10, 5, 15, 65, 20, 0]
      }
    };
    const $ = (id) => document.getElementById(id);
    const iconSvg = (code, isDay = true) => {
      if (code === 0 && isDay) return `<svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="21" fill="#F7BE55"/><g stroke="#F7BE55" stroke-width="5" stroke-linecap="round"><path d="M60 13v10M60 97v10M13 60h10m74 0h10M27 27l7 7m52 52 7 7m0-66-7 7m-52 52-7 7"/></g></svg>`;
      if (code === 1 && isDay) return `<svg viewBox="0 0 120 120" fill="none"><circle cx="70" cy="42" r="21" fill="#F7BE55"/><path d="M28 83h57a18 18 0 0 0 1-36 24 24 0 0 0-46-2 19 19 0 0 0-12 38Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M28 83h57a18 18 0 0 0 1-36 24 24 0 0 0-46-2 19 19 0 0 0-12 38Z" fill="url(#cloud)"/><defs><linearGradient id="cloud" x1="42" y1="49" x2="76" y2="87" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#DBEAFE"/></linearGradient></defs></svg>`;
      if (code === 2) return `<svg viewBox="0 0 120 120" fill="none"><circle cx="74" cy="38" r="20" fill="#F7BE55"/><path d="M25 79h62a18 18 0 0 0 1-36 24 24 0 0 0-46-2 20 20 0 0 0-17 38Z" fill="#F8FBFF" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M25 79h62a18 18 0 0 0 1-36 24 24 0 0 0-46-2 20 20 0 0 0-17 38Z" fill="url(#cloud2)"/><defs><linearGradient id="cloud2" x1="45" y1="45" x2="68" y2="83" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#C7DCF3"/></linearGradient></defs></svg>`;
      if (code === 3 || code === 45 || code === 48) return `<svg viewBox="0 0 120 120" fill="none"><path d="M27 77h61a18 18 0 0 0 1-36 24 24 0 0 0-46-2 20 20 0 0 0-16 38Z" fill="#EEF4FC" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M36 91h48m-40 9h32" stroke="#B3C9E1" stroke-width="5" stroke-linecap="round"/></svg>`;
      if (code >= 51 && code <= 67 || code >= 80 && code <= 82) return `<svg viewBox="0 0 120 120" fill="none"><path d="M24 68h64a18 18 0 0 0 1-36 24 24 0 0 0-46-2 20 20 0 0 0-19 38Z" fill="#F1F6FC" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><g stroke="#5CA6E8" stroke-width="5" stroke-linecap="round"><path d="m42 81-4 10m23-10-4 10m23-10-4 10"/></g></svg>`;
      if (code >= 71 && code <= 77 || code === 85 || code === 86) return `<svg viewBox="0 0 120 120" fill="none"><path d="M24 68h64a18 18 0 0 0 1-36 24 24 0 0 0-46-2 20 20 0 0 0-19 38Z" fill="#F1F6FC" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><g stroke="#70A9DD" stroke-width="4" stroke-linecap="round"><path d="M42 80v13m-6-7h12m17-6v13m-6-7h12m11-6v13m-6-7h12"/></g></svg>`;
      return `<svg viewBox="0 0 120 120" fill="none"><path d="M24 68h64a18 18 0 0 0 1-36 24 24 0 0 0-46-2 20 20 0 0 0-19 38Z" fill="#EDF4FC" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="m54 72-10 17h11l-4 14 20-22H59l7-9" fill="#F3B644" stroke="#F3B644" stroke-linejoin="round"/></svg>`;
    };
    const weatherText = (code) => {
      if (code === 0) return "Clear sky";
      if (code === 1) return "Mainly clear";
      if (code === 2) return "Partly cloudy";
      if (code === 3) return "Overcast";
      if (code === 45 || code === 48) return "Foggy";
      if (code >= 51 && code <= 57) return "Drizzle";
      if (code >= 61 && code <= 67) return "Rain";
      if (code >= 71 && code <= 77) return "Snow";
      if (code >= 80 && code <= 82) return "Rain showers";
      if (code === 85 || code === 86) return "Snow showers";
      if (code >= 95) return "Thunderstorm";
      return "Cloudy";
    };
    const round = (value) => Math.round(value);
    let temperatureUnit = "fahrenheit";
    let displayedWeather;
    let displayedPlace;
    let displayedFallback = false;
    const displayPlace = (place) => {
      if (place.name === "Fargo" && (place.admin1 === "North Dakota" || place.admin1 === "ND")) return "Fargo, ND";
      return [place.name, place.admin1].filter(Boolean).join(", ");
    };
    const formatTemp = (value) => {
      const converted = temperatureUnit === "fahrenheit" ? value * 9 / 5 + 32 : value;
      return `${round(converted)}°${temperatureUnit === "fahrenheit" ? "F" : "C"}`;
    };
    const formatDay = (date) => new Intl.DateTimeFormat(undefined, { weekday: "short", timeZone: "UTC" }).format(new Date(`${date}T12:00:00Z`));
    const formatDate = (date, timezone) => new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric", timeZone: timezone }).format(date);

    function render(data, place, isFallback = false) {
      displayedWeather = data;
      displayedPlace = place;
      displayedFallback = isFallback;
      const current = data.current;
      const daily = data.daily;
      const now = new Date();
      $("location").textContent = displayPlace(place);
      $("today").textContent = formatDate(now, data.timezone || "auto");
      $("temperature").textContent = round(temperatureUnit === "fahrenheit" ? current.temperature_2m * 9 / 5 + 32 : current.temperature_2m);
      $("temperature-unit").textContent = `°${temperatureUnit === "fahrenheit" ? "F" : "C"}`;
      $("condition").textContent = weatherText(current.weather_code);
      $("feels-like").textContent = `Feels like ${formatTemp(current.apparent_temperature)}`;
      $("high-low").textContent = `${formatTemp(daily.temperature_2m_max[0])} / ${formatTemp(daily.temperature_2m_min[0])}`;
      $("humidity").textContent = `${Math.round(current.relative_humidity_2m)}%`;
      $("wind").textContent = `${round(current.wind_speed_10m * 0.621371)} mph`;
      $("hero-icon").innerHTML = iconSvg(current.weather_code, current.is_day !== 0);
      $("data-status").textContent = isFallback ? "Sample data" : "Live weather";
      $("status-dot").style.background = isFallback ? "#e5a23e" : "#48a977";
      const cards = [];
      for (let i = 1; i <= 5; i++) {
        const code = daily.weather_code[i];
        const chance = daily.precipitation_probability_max?.[i];
        cards.push(`<article class="day-card" aria-label="${formatDay(daily.time[i])}: ${weatherText(code)}, high ${formatTemp(daily.temperature_2m_max[i])}, low ${formatTemp(daily.temperature_2m_min[i])}">
          <span class="day-name">${formatDay(daily.time[i])}</span>
          <span class="day-icon" aria-hidden="true">${iconSvg(code)}</span>
          <span class="day-condition">${weatherText(code)}</span>
          <span class="day-temps"><span>${formatTemp(daily.temperature_2m_max[i])}</span><span class="low">${formatTemp(daily.temperature_2m_min[i])}</span></span>
          ${chance >= 30 ? `<span class="day-condition" style="margin-top:3px;color:var(--blue)">${chance}% rain</span>` : ""}
        </article>`);
      }
      $("forecast").innerHTML = cards.join("");
    }

    function validWeather(data) {
      return data?.current && data?.daily?.time?.length >= 6 &&
        data.daily.weather_code?.length >= 6 &&
        data.daily.temperature_2m_max?.length >= 6 &&
        data.daily.temperature_2m_min?.length >= 6;
    }

    async function getWeather(place) {
      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.search = new URLSearchParams({
        latitude: place.latitude,
        longitude: place.longitude,
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        temperature_unit: "celsius",
        wind_speed_unit: "mph",
        timezone: "auto",
        forecast_days: "6"
      });
      const response = await fetch(url);
      if (!response.ok) throw new Error("Weather service is temporarily unavailable.");
      const data = await response.json();
      if (!validWeather(data)) throw new Error("Weather service returned incomplete data.");
      return data;
    }

    async function findPlace(query) {
      const url = new URL("https://geocoding-api.open-meteo.com/v1/search");
      url.search = new URLSearchParams({ name: query, count: "1", language: "en", format: "json" });
      const response = await fetch(url);
      if (!response.ok) throw new Error("City search is temporarily unavailable.");
      const data = await response.json();
      if (!data.results?.length) throw new Error(`No city found for “${query}”. Try another name.`);
      return data.results[0];
    }

    async function loadPlace(place, query = "") {
      const button = $("search-button");
      const message = $("search-message");
      button.disabled = true;
      button.textContent = "Loading";
      message.classList.remove("error");
      message.textContent = query ? `Looking up ${query}…` : "";
      try {
        const weather = await getWeather(place);
        render(weather, place);
        message.textContent = "";
        $("city-search").value = "";
      } catch (error) {
        if (place.name === "Fargo" || place === FALLBACK) {
          render(FALLBACK, FALLBACK, true);
          message.textContent = "Couldn’t reach Open-Meteo. Showing a saved Fargo forecast.";
        } else {
          message.classList.add("error");
          message.textContent = error.message || "Couldn’t load weather. Please try again.";
        }
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    }

    $("search-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = $("city-search").value.trim();
      if (!query) {
        $("search-message").textContent = "Enter a city to see its forecast.";
        $("search-message").classList.add("error");
        $("city-search").focus();
        return;
      }
      $("search-button").disabled = true;
      $("search-button").textContent = "Loading";
      $("search-message").classList.remove("error");
      $("search-message").textContent = `Searching for ${query}…`;
      try {
        const place = await findPlace(query);
        await loadPlace(place, query);
      } catch (error) {
        $("search-message").classList.add("error");
        $("search-message").textContent = error.message || "Couldn’t find that city. Please try again.";
        $("search-button").disabled = false;
        $("search-button").textContent = "Search";
      }
    });

    function setTemperatureUnit(unit) {
      temperatureUnit = unit;
      $("unit-f").setAttribute("aria-pressed", String(unit === "fahrenheit"));
      $("unit-c").setAttribute("aria-pressed", String(unit === "celsius"));
      if (displayedWeather && displayedPlace) render(displayedWeather, displayedPlace, displayedFallback);
    }
    $("unit-f").addEventListener("click", () => setTemperatureUnit("fahrenheit"));
    $("unit-c").addEventListener("click", () => setTemperatureUnit("celsius"));

    render(FALLBACK, FALLBACK, true);
    $("search-message").textContent = "";
    const fargo = { name: "Fargo", admin1: "North Dakota", latitude: 46.8772, longitude: -96.7898, timezone: "America/Chicago" };
    loadPlace(fargo);
  </script>
</body>
</html>
